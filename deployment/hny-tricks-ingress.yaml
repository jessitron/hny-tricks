apiVersion: "networking.k8s.io/v1"
kind: Ingress

# The app this is pointing to is deployed manually, from the jessitron/hny-tricks repo.

metadata:
  name: nginx-for-hny-tricks-ingress
  namespace: default
  labels:
    app.kubernetes.io/name: hny-tricks
    app.kubernetes.io/instance: hny-tricks
    app.kubernetes.io/component: nginx-for-hny-tricks-ingress
    app.kubernetes.io/version: "1.2.1"
  annotations:
    external-dns.alpha.kubernetes.io/hostname: util.jessitron.honeydemo.io # give your domain name here
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443},{"HTTP":80}]'
    alb.ingress.kubernetes.io/load-balancer-attributes: access_logs.s3.enabled=true,access_logs.s3.bucket=orion-alb-access-logs,access_logs.s3.prefix=orion-alb
    alb.ingress.kubernetes.io/group.name: "only-one-alb-please"
spec:
  ingressClassName: alb
  tls:
    - hosts:
        - "util.jessitron.honeydemo.io"
  rules:
    - host: "util.jessitron.honeydemo.io"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx-for-hny-tricks
                port:
                  number: 8080
